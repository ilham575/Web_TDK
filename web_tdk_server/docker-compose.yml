services:
  mysql:
    image: mysql:8.0
    container_name: web_tdk_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-web_tdk_db}
      MYSQL_USER: ${MYSQL_USER:-web_tdk_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_app_password_change_me}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: web_tdk_server
    restart: always
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - DEBUG=${DEBUG:-True}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - FILE_STORAGE_BACKEND=${FILE_STORAGE_BACKEND:-auto}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - LOCAL_UPLOAD_DIR=${LOCAL_UPLOAD_DIR:-uploads/logos}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - ./uploads:/app/uploads

volumes:
  mysql_data: